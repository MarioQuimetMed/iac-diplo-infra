# AI Code Review con Claude — lo más trending en CI/CD 2026.
#
# Qué hace:
#   Cuando se abre o actualiza un Pull Request, Claude lee el diff y
#   deja comentarios inline sobre:
#     - bugs o errores lógicos
#     - problemas de seguridad
#     - oportunidades de simplificación
#     - inconsistencias con el resto del repo
#
# También se puede invocar manualmente comentando "@claude <pregunta>"
# en cualquier PR o issue.
#
# Requisitos (Settings → Secrets and variables → Actions → Secrets):
#   ANTHROPIC_API_KEY  → tu API key de https://console.anthropic.com/
#
# Por qué importa para el módulo:
#   Es el patrón "AI-augmented CI/CD" que se está volviendo standard.
#   Empresas como Vercel, Shopify y Cloudflare lo usan en producción.
#   El reviewer humano sigue siendo el que aprueba, pero Claude levanta
#   el 80% del trabajo mecánico (typos, edge cases, naming, etc.).

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    name: Claude reviews this PR
    runs-on: ubuntu-latest

    # Permisos que la action necesita para:
    #   - leer el código del PR
    #   - dejar comentarios y reviews
    #   - leer el estado de los checks (para entender contexto)
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          # Modelo: Sonnet 4.6 es la mejor relación costo/calidad para reviews.
          # Para reviews muy críticos podés cambiar a claude-opus-4-8.
          claude_args: '--model claude-sonnet-4-6 --dangerously-skip-permissions'
          prompt: |
            Sos un reviewer experto de NestJS, Terraform y CI/CD.
            Por favor analiza los cambios del Pull Request actual. Para ver los cambios, usa la herramienta Bash para ejecutar `git diff origin/main...HEAD` o lee los archivos modificados directamente.
            
            ¡MUY IMPORTANTE!: NO utilices la herramienta o skill "review" ni intentes usar "gh pr list". Estás en un entorno de Integración Continua sin interacción humana, por lo que esas herramientas interactivas fallarán. Tu objetivo es obtener el diff por tu cuenta y luego generar tu respuesta final aquí.

            Realiza lo siguiente en tu respuesta final:
            1. Un comentario GENERAL resumiendo los cambios (mensaje bien corto y conciso, si no hay nada mal solo di "todo bien"), qué te parecen y si hay algún riesgo potencial. **SIEMPRE debes dejar este comentario general** para confirmar que completaste la revisión.
            2. Adicionalmente, si encuentras errores, redacta comentarios INLINE en las líneas de código afectadas sobre:
               - Bugs reales o errores lógicos.
               - Problemas de seguridad (inyección, secretos, IAM, CORS, etc.).
               - Inconsistencias con el resto del repo (naming, patrones).
               - Simplificaciones obvias.

            Reglas:
              - SIEMPRE deja un comentario general en tu output final, aunque el código esté perfecto.
              - Para los comentarios inline, sé conciso. Un comentario por hallazgo, sin párrafos.
              - Respondé en español.
